spring:
  datasource:
    url: jdbc:mysql://172.19.230.2:33306/astron_console?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123
    # HikariCP connection pool configuration
    hikari:
      # Maximum pool size
      maximum-pool-size: 10
      # Minimum idle connections
      minimum-idle: 2
      # Connection timeout (ms)
      connection-timeout: 30000
      # Idle timeout (ms)
      idle-timeout: 600000
      # Max connection lifetime (ms)
      max-lifetime: 1800000
      # Validation timeout (ms)
      validation-timeout: 5000
      # Connection test query
      connection-test-query: SELECT 1
      # Pool name
      pool-name: AstronHikariCP
      # Auto commit
      auto-commit: true
      # Leak detection threshold (ms)
      leak-detection-threshold: 60000
  data:
    redis:
      host: 172.19.230.2
      port: 36379
      database: 1
      # Lettuce connection pool configuration for reduced memory usage
      lettuce:
        pool:
          max-active: 8      # Maximum number of active connections
          max-idle: 4        # Maximum number of idle connections
          min-idle: 1        # Minimum number of idle connections
          max-wait: 3000ms   # Maximum wait time when pool is exhausted
      password: 123
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://172.19.230.2:8000
          jwk-set-uri: http://172.19.230.2:8000/.well-known/jwks
          audiences:
            - astron-agent-client

# S3(MinIO) basic configuration
s3:
  endpoint: http://172.19.230.2:18998
  remoteEndpoint: http://172.19.230.2:18998
  accessKey: minioadmin
  secretKey: minioadmin123
  bucket: console-oss
  presignExpirySeconds: 600
  enablePublicRead: true