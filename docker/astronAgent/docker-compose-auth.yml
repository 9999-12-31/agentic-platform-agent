services:
  casdoor:
    image: harbor.bigdata.com/agentic/casbin/casdoor:v2.67.0
    container_name: astron-agent-casdoor
    restart: always
    user: root
    ports:
      - "${CASDOOR_PORT:-8000}:8000"
    environment:
      - GIN_MODE=release
      - CONSOLE_DOMAIN=${CONSOLE_DOMAIN:-http://localhost}
      - HOST_BASE_ADDRESS=${HOST_BASE_ADDRESS:-http://localhost}
      - origin=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
      - originFrontend=${CONSOLE_CASDOOR_URL:-http://localhost:8000}
      - TZ=Asia/Shanghai  # ← 统一时区
    volumes:
      - ./casdoor/conf:/conf-templates:ro
      - ./casdoor/entrypoint.sh:/entrypoint.sh:ro
      - casdoor-logs:/logs
      - /etc/localtime:/etc/localtime:ro  # ← 挂载宿主机时区
    networks:
      - astron-agent-network
    depends_on:
      - casdoor-mysql
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  casdoor-mysql:
    image: harbor.bigdata.com/agentic/mysql:8.4
    container_name: astron-agent-casdoor-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: casdoor
      MYSQL_USER: casdoor
      MYSQL_PASSWORD: casdoor123
      TZ: Asia/Shanghai  # ← 新增：确保 MySQL 内部函数（如 NOW()）使用正确时区
    volumes:
      - casdoor-mysql-data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro  # ← 新增：同步系统时间
    networks:
      - astron-agent-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

# ============================================================================
# Network Configuration
# ============================================================================
networks:
  astron-agent-network:
    driver: bridge

volumes:
  casdoor-logs:
  casdoor-mysql-data:
